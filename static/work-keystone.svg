<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f14"/>
      <stop offset="100%" style="stop-color:#1a2530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8a6a2f"/>
      <stop offset="100%" style="stop-color:#b08a45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#2a3540" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="0" x2="800" y2="0"/>
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="0" x2="0" y2="500"/>
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>
  <!-- Tower silhouette -->
  <g transform="translate(320, 80)">
    <!-- Podium -->
    <rect x="-80" y="260" width="160" height="80" fill="#1a2530" stroke="#8a6a2f" stroke-width="2" rx="2"/>
    <rect x="-70" y="270" width="140" height="60" fill="#0f1820" opacity="0.6"/>
    <!-- Tower floors -->
    <g fill="#1a2530" stroke="#2a3540" stroke-width="1">
      <rect x="-70" y="220" width="140" height="35"/>
      <rect x="-70" y="185" width="140" height="35"/>
      <rect x="-70" y="150" width="140" height="35"/>
      <rect x="-70" y="115" width="140" height="35"/>
      <rect x="-70" y="80" width="140" height="35"/>
      <rect x="-70" y="45" width="140" height="35"/>
      <rect x="-70" y="10" width="140" height="35"/>
    </g>
    <!-- Crown -->
    <rect x="-60" y="-30" width="120" height="40" fill="#1a2530" stroke="#8a6a2f" stroke-width="2" rx="2"/>
    <rect x="-50" y="-20" width="100" height="20" fill="#0f1820" opacity="0.6"/>
    <!-- Accent lines -->
    <line x1="-80" y1="260" x2="80" y2="260" stroke="url(#accent)" stroke-width="3"/>
    <line x1="-60" y1="-30" x2="60" y2="-30" stroke="url(#accent)" stroke-width="2"/>
  </g>
  <!-- Labels -->
  <text x="400" y="420" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#f7f8f9">KEYSTONE ASSET MANAGEMENT</text>
  <text x="400" y="455" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#8a6a2f" letter-spacing="0.2em">INSTITUTIONAL CRE · 3D MASSING STUDY</text>
  <!-- Corner badge -->
  <rect x="600" y="20" width="180" height="50" rx="25" fill="url(#accent)" opacity="0.9"/>
  <text x="690" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0b0f14">22 FLOORS · 4 VIEWS</text>
</svg>